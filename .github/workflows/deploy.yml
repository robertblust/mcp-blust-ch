name: deploy
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
env:
  REGISTRY: europe-west6-docker.pkg.dev/blust-ch-mcp/mcp
  WIF_PROVIDER: projects/38003987140/locations/global/workloadIdentityPools/github/providers/github
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm test
      - id: tag
        run: echo "image=$REGISTRY/server:$(node build/tag.mjs)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - run: docker build -t "${{ steps.tag.outputs.image }}" .
      - if: github.event_name == 'push'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: deploy@blust-ch-mcp.iam.gserviceaccount.com
      - if: github.event_name == 'push'
        run: gcloud auth configure-docker europe-west6-docker.pkg.dev --quiet && docker push "${{ steps.tag.outputs.image }}"
  terraform:
    needs: build
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: terraform@blust-ch-mcp.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - run: terraform init -input=false
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - run: terraform -chdir=bootstrap init -backend=false -input=false && terraform -chdir=bootstrap validate
      - if: github.event_name == 'pull_request'
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -var "image=$IMAGE" > plan.txt 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        continue-on-error: true
      - if: github.event_name == 'pull_request'
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo 'Terraform plan for `'"$IMAGE"'`'; echo; echo '```'; tail -c 60000 plan.txt; echo '```'; } > comment.md
          gh pr comment "$PR" --repo "${{ github.repository }}" --body-file comment.md
          test "${{ steps.plan.outputs.exit }}" = "0"
      - if: github.event_name == 'push'
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: terraform apply -input=false -auto-approve -var "image=$IMAGE"
      - if: github.event_name == 'push'
        run: |
          URL=$(terraform output -raw service_url)
          WANT=$(jq -r .commit ../source.json)
          GOT=$(curl -fsS --retry 10 --retry-all-errors --retry-delay 5 --max-time 30 "$URL/healthz" | jq -r .model.commit)
          echo "serving $GOT, pinned $WANT"; test "$GOT" = "$WANT"
