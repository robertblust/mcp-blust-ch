<!-- The brand lockup blust.ch opens with, the same markup: the plate and the letters take
     their colors from the tokens, so the mark follows the theme where an image could not.
     Copied rather than shared for the reason every surface in this family copies it — the
     design package styles .rbmark and .brand and ships no SVG for either. -->
<svg viewBox="0 0 32 32" aria-hidden="true"><rect class="plate" x=".75" y=".75" width="30.5" height="30.5" rx="7"/><text class="rb" x="16" y="22.5" text-anchor="middle" font-family="Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600">rb</text></svg><b>Robert <span>Blust</span></b>
